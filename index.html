<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>To-Do Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To-Do Tracker">
<meta name="theme-color" content="#0c0b09">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
</head>
<body>
<style>
:root {
  color-scheme: dark;
  --bg: #0c0b09;
  --card-bg: #17140f;
  --text: #f2c94c;
  --text-muted: #a3872f;
  --border: #3a2f18;
  --accent: #d4af37;
  --accent-hover: #f0c95c;
  --done: #6b5a2c;
  --danger: #e0674a;
  --high: #ff7a59;
  --medium: #d4af37;
  --low: #8f8a6e;
  --private: #9fc48a;
  --work: #86aedb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 48px 16px;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
}

.app {
  width: 100%;
  max-width: 480px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
}

h1 {
  margin: 0 0 20px;
  font-size: 1.5rem;
  text-align: center;
  color: var(--accent);
}

button {
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.9rem;
  font-family: inherit;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---- Add form ---- */

#todo-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}

.input-row {
  display: flex;
  gap: 8px;
}

.input-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

#todo-input {
  width: 100%;
  padding: 10px 44px 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.95rem;
}

#todo-input::placeholder {
  color: var(--text-muted);
}

#todo-input:focus {
  outline: none;
  border-color: var(--accent);
}

.mic-btn {
  position: absolute;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  color: var(--text-muted);
  border-radius: 8px;
}

.mic-btn[hidden] {
  display: none;
}

.mic-btn:hover {
  color: var(--accent);
}

.mic-btn.listening {
  background: var(--danger);
  color: #1a1408;
  animation: mic-pulse 1.2s ease-in-out infinite;
}

@keyframes mic-pulse {
  50% {
    opacity: 0.6;
  }
}

#add-btn {
  padding: 10px 16px;
  background: var(--accent);
  color: #1a1408;
  font-weight: 700;
  transition: background 0.15s;
}

#add-btn:hover {
  background: var(--accent-hover);
}

.options-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
}

.segmented {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.segmented button {
  padding: 7px 13px;
  border-radius: 0;
  background: var(--bg);
  color: var(--text-muted);
  font-weight: 600;
}

.segmented button[aria-pressed="true"] {
  background: var(--accent);
  color: #1a1408;
}

.date-field {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  font-size: 0.8rem;
  color: var(--text-muted);
}

#todo-due {
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 0.85rem;
}

.voice-hint {
  margin: 0;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.8rem;
  line-height: 1.4;
  color: var(--text-muted);
}

.voice-hint[hidden] {
  display: none;
}

/* ---- Filter tabs ---- */

.filters {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.filter-btn {
  padding: 8px 10px;
  margin-bottom: -1px;
  border-radius: 8px 8px 0 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--text-muted);
  font-weight: 600;
}

.filter-btn[aria-pressed="true"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.filter-btn .count {
  margin-left: 4px;
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

/* ---- Board ---- */

.board {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 20px;
}

.priority-section {
  min-width: 0;
}

.section-title {
  margin: 0 0 6px;
  padding-bottom: 5px;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border);
}

.section-title.priority-high {
  color: var(--high);
}

.section-title.priority-medium {
  color: var(--medium);
}

.section-title.priority-low {
  color: var(--low);
}

.section-title.done-title {
  color: var(--text-muted);
}

.priority-list,
.done-list {
  list-style: none;
  margin: 0;
  padding: 0;
  min-height: 6px;
}

.priority-list:empty,
.priority-list:has(.empty-hint) {
  min-height: 0;
}

.todo-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--border);
  cursor: grab;
  touch-action: manipulation;
  background: var(--card-bg);
}

.todo-row:last-child {
  border-bottom: none;
}

.todo-row.dragging {
  opacity: 0.85;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
  border-radius: 8px;
  transform: scale(1.02);
  touch-action: none;
}

.todo-row input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin: 2px 0 0;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

.todo-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}

.todo-text {
  max-width: 100%;
  word-break: break-word;
  font-size: 0.95rem;
  line-height: 1.35;
  cursor: text;
}

.todo-row.completed {
  cursor: default;
}

.todo-row.completed .todo-text {
  text-decoration: line-through;
  color: var(--done);
}

.edit-input {
  width: 100%;
  min-width: 0;
  font: inherit;
  font-size: 0.95rem;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 3px 7px;
}

.edit-input:focus {
  outline: none;
}

/* ---- Chips: priority, category, due date ---- */

.todo-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.chip,
.priority-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: 0.02em;
}

.priority-badge.priority-high {
  color: var(--high);
  border-color: var(--high);
}

.priority-badge.priority-medium {
  color: var(--medium);
  border-color: var(--medium);
}

.priority-badge.priority-low {
  color: var(--low);
  border-color: var(--low);
}

.cat-private {
  color: var(--private);
  border-color: var(--private);
}

.cat-work {
  color: var(--work);
  border-color: var(--work);
}

.due-wrap {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.due-chip {
  color: var(--text-muted);
  border-color: var(--border);
  cursor: pointer;
}

.due-chip.due-today {
  color: var(--accent);
  border-color: var(--accent);
}

.due-chip.due-overdue {
  color: var(--danger);
  border-color: var(--danger);
}

.due-chip.due-empty {
  border-style: dashed;
  font-weight: 600;
  opacity: 0.75;
}

/* The real date input sits invisibly on top of the chip, so a click or tap
   anywhere on the chip opens the native date picker. */
.due-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.due-input::-webkit-calendar-picker-indicator {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.due-clear {
  padding: 0 5px;
  background: none;
  color: var(--text-muted);
  font-size: 1rem;
  line-height: 1;
}

.due-clear:hover {
  color: var(--danger);
}

.delete-btn {
  flex-shrink: 0;
  padding: 2px 6px;
  background: none;
  color: var(--text-muted);
  font-size: 1.1rem;
  line-height: 1;
}

.delete-btn:hover {
  color: var(--danger);
}

.empty-hint {
  text-align: center;
  color: var(--text-muted);
  padding: 10px 0;
  font-size: 0.8rem;
  font-style: italic;
}

.done-section {
  margin-bottom: 16px;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 4px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 0.85rem;
  color: var(--text-muted);
}

.overdue-left {
  color: var(--danger);
}

#clear-completed {
  background: none;
  color: var(--text-muted);
  padding: 4px 6px;
}

#clear-completed:hover {
  color: var(--danger);
}

/* ---- Productivity ---- */

.stats {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.stats-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.stats-title {
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--accent);
}

.streak {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.chart {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 8px;
  height: 90px;
}

.chart-day {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  gap: 6px;
}

.chart-bar-track {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.chart-bar {
  width: 60%;
  min-height: 3px;
  border-radius: 4px 4px 0 0;
  background: var(--accent);
  transition: height 0.2s;
}

.chart-day.today .chart-bar {
  background: var(--accent-hover);
}

.chart-count {
  font-size: 0.7rem;
  color: var(--text-muted);
}

.chart-label {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.chart-day.today .chart-label {
  color: var(--accent);
  font-weight: 600;
}

/* iOS zooms into inputs below 16px; keep them at 16px on touch screens. */
@media (pointer: coarse) {
  #todo-input,
  #todo-due,
  .edit-input {
    font-size: 16px;
  }
}

@media (max-width: 520px) {
  body {
    padding: 20px 12px;
  }

  .app {
    padding: 20px;
  }

  .date-field {
    margin-left: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mic-btn.listening {
    animation: none;
  }

  .chart-bar {
    transition: none;
  }
}


/* ---- iPhone home-screen overrides ---- */
* { -webkit-tap-highlight-color: transparent; }
html { min-height: 100vh; background: var(--bg); }
body { padding: max(20px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom)); }
.app { padding: 20px; }
.todo-row input[type="checkbox"] { width: 20px; height: 20px; }
.delete-btn { padding: 4px 8px; font-size: 1.2rem; }
.chart { gap: 6px; }

</style>

<div class="app">
    <h1>📝 Meine To-Dos</h1>

    <form id="todo-form" autocomplete="off">
      <div class="input-row">
        <div class="input-wrap">
          <input type="text" id="todo-input" placeholder="Neue Aufgabe…" required>
          <button type="button" id="mic-btn" class="mic-btn" aria-label="Aufgabe einsprechen" title="Aufgabe einsprechen" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <path d="M12 18v3"></path>
            </svg>
          </button>
        </div>
        <button type="submit" id="add-btn">Hinzufügen</button>
      </div>

      <div class="options-row">
        <div class="segmented" id="category-select" role="group" aria-label="Kategorie der neuen Aufgabe">
          <button type="button" data-category="private" aria-pressed="true">Privat</button>
          <button type="button" data-category="work" aria-pressed="false">Geschäftlich</button>
        </div>
        <label class="date-field">
          <span>Fällig</span>
          <input type="date" id="todo-due" aria-label="Fälligkeitsdatum der neuen Aufgabe">
        </label>
      </div>

      <p class="voice-hint" id="voice-hint" role="status" hidden></p>
    </form>

    <div class="filters" id="filters" role="group" aria-label="Aufgaben filtern">
      <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">Alle <span class="count">0</span></button>
      <button type="button" class="filter-btn" data-filter="private" aria-pressed="false">Privat <span class="count">0</span></button>
      <button type="button" class="filter-btn" data-filter="work" aria-pressed="false">Geschäftlich <span class="count">0</span></button>
    </div>

    <div class="board">
      <section class="priority-section">
        <h2 class="section-title priority-high">Hoch</h2>
        <ul class="priority-list" data-priority="high"></ul>
      </section>
      <section class="priority-section">
        <h2 class="section-title priority-medium">Mittel</h2>
        <ul class="priority-list" data-priority="medium"></ul>
      </section>
      <section class="priority-section">
        <h2 class="section-title priority-low">Niedrig</h2>
        <ul class="priority-list" data-priority="low"></ul>
      </section>
    </div>

    <div class="done-section">
      <h2 class="section-title done-title">Erledigt</h2>
      <ul class="done-list" id="done-list"></ul>
    </div>

    <div class="footer">
      <span>
        <span id="items-left">0 Aufgaben offen</span><span id="overdue-left" class="overdue-left"></span>
      </span>
      <button id="clear-completed">Erledigte löschen</button>
    </div>

    <div class="stats">
      <div class="stats-header">
        <span class="stats-title">📈 Produktivität</span>
        <span class="streak" id="streak">🔥 0 Tage Streak</span>
      </div>
      <div class="chart" id="chart"></div>
    </div>
  </div>

<script>
const TODOS_KEY = "todos";
const HISTORY_KEY = "completionHistory";
const FILTER_KEY = "todoFilter";
const CATEGORY_KEY = "todoLastCategory";
const PRIORITY_LABEL = { high: "Hoch", medium: "Mittel", low: "Niedrig" };
const PRIORITIES = ["high", "medium", "low"];
const CATEGORY_LABEL = { private: "Privat", work: "Geschäftlich" };
const CATEGORIES = ["private", "work"];

const form = document.getElementById("todo-form");
const input = document.getElementById("todo-input");
const dueInput = document.getElementById("todo-due");
const micBtn = document.getElementById("mic-btn");
const voiceHint = document.getElementById("voice-hint");
const categoryButtons = document.querySelectorAll("#category-select button");
const filterButtons = document.querySelectorAll("#filters .filter-btn");
const doneList = document.getElementById("done-list");
const itemsLeft = document.getElementById("items-left");
const overdueLeft = document.getElementById("overdue-left");
const clearCompletedBtn = document.getElementById("clear-completed");
const streakEl = document.getElementById("streak");
const chartEl = document.getElementById("chart");
const priorityLists = {};
PRIORITIES.forEach((p) => {
  priorityLists[p] = document.querySelector(`.priority-list[data-priority="${p}"]`);
});

function readPref(key, fallback) {
  try {
    return localStorage.getItem(key) || fallback;
  } catch (err) {
    return fallback;
  }
}

function writePref(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (err) {
    /* preferences are a convenience only */
  }
}

let todos = JSON.parse(localStorage.getItem(TODOS_KEY)) || [];
// history: one entry per completed task, kept even after the task is deleted
// so productivity stats stay accurate. Shape: { todoId, date: "YYYY-MM-DD" }
let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];

// Tasks saved by earlier versions get sensible defaults.
todos.forEach((t) => {
  if (!t.priority) t.priority = "high";
  if (!CATEGORIES.includes(t.category)) t.category = "private";
  if (!t.due) t.due = null;
});

let filter = readPref(FILTER_KEY, "all");
if (filter !== "all" && !CATEGORIES.includes(filter)) filter = "all";
let newCategory = readPref(CATEGORY_KEY, "private");
if (!CATEGORIES.includes(newCategory)) newCategory = "private";
if (filter !== "all") newCategory = filter;

function saveTodos() {
  localStorage.setItem(TODOS_KEY, JSON.stringify(todos));
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function dateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function parseDateStr(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// Label + state for a task's due date chip.
function dueInfo(todo) {
  if (!todo.due) return null;
  const due = parseDateStr(todo.due);
  const diffDays = Math.round((due - startOfToday()) / 86400000);
  let label;
  if (diffDays === 0) label = "Heute";
  else if (diffDays === 1) label = "Morgen";
  else if (diffDays === -1) label = "Gestern";
  else {
    const opts = { weekday: "short", day: "numeric", month: "numeric" };
    if (due.getFullYear() !== new Date().getFullYear()) opts.year = "2-digit";
    label = due.toLocaleDateString("de-DE", opts).replace(".", "");
  }
  let state = "due-later";
  if (!todo.done && diffDays < 0) state = "due-overdue";
  else if (!todo.done && diffDays === 0) state = "due-today";
  return { label, state, overdue: state === "due-overdue" };
}

function isVisible(todo) {
  return filter === "all" || todo.category === filter;
}

function createCategoryChip(todo) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = `chip cat-chip cat-${todo.category}`;
  btn.textContent = CATEGORY_LABEL[todo.category];
  btn.title = "Kategorie wechseln";
  btn.addEventListener("click", () => {
    todo.category = todo.category === "work" ? "private" : "work";
    saveTodos();
    render();
  });
  return btn;
}

function createDueChip(todo) {
  const info = dueInfo(todo);
  const wrap = document.createElement("span");
  wrap.className = "due-wrap";

  const label = document.createElement("label");
  label.className = "chip due-chip " + (info ? info.state : "due-empty");
  const text = document.createElement("span");
  text.textContent = info ? info.label : "+ Datum";

  const picker = document.createElement("input");
  picker.type = "date";
  picker.className = "due-input";
  picker.value = todo.due || "";
  picker.setAttribute("aria-label", "Fälligkeitsdatum");
  picker.addEventListener("click", () => {
    try {
      picker.showPicker();
    } catch (err) {
      /* browsers without showPicker open the native picker themselves */
    }
  });
  picker.addEventListener("change", () => {
    todo.due = picker.value || null;
    saveTodos();
    render();
  });

  label.appendChild(text);
  label.appendChild(picker);
  wrap.appendChild(label);

  if (info) {
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "due-clear";
    clear.textContent = "×";
    clear.title = "Datum entfernen";
    clear.setAttribute("aria-label", "Fälligkeitsdatum entfernen");
    clear.addEventListener("click", () => {
      todo.due = null;
      saveTodos();
      render();
    });
    wrap.appendChild(clear);
  }
  return wrap;
}

function createRow(todo, { showPriorityBadge }) {
  const li = document.createElement("li");
  li.className = "todo-row" + (todo.done ? " completed" : "");
  li.dataset.id = todo.id;

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = todo.done;
  checkbox.setAttribute("aria-label", "Erledigt");
  checkbox.addEventListener("change", () => toggleTodo(todo.id));

  const body = document.createElement("div");
  body.className = "todo-body";

  const span = document.createElement("span");
  span.className = "todo-text";
  span.textContent = todo.text;
  span.title = "Klicken, um zu bearbeiten";
  span.addEventListener("click", () => startEdit(span, todo));

  const meta = document.createElement("div");
  meta.className = "todo-meta";
  if (showPriorityBadge) {
    const badge = document.createElement("span");
    badge.className = `priority-badge priority-${todo.priority}`;
    badge.textContent = PRIORITY_LABEL[todo.priority];
    meta.appendChild(badge);
  }
  meta.appendChild(createCategoryChip(todo));
  meta.appendChild(createDueChip(todo));

  body.appendChild(span);
  body.appendChild(meta);

  const deleteBtn = document.createElement("button");
  deleteBtn.className = "delete-btn";
  deleteBtn.textContent = "✕";
  deleteBtn.type = "button";
  deleteBtn.title = "Löschen";
  deleteBtn.setAttribute("aria-label", "Aufgabe löschen");
  deleteBtn.addEventListener("click", () => deleteTodo(todo.id));

  li.appendChild(checkbox);
  li.appendChild(body);
  li.appendChild(deleteBtn);
  return li;
}

function startEdit(span, todo) {
  const editInput = document.createElement("input");
  editInput.type = "text";
  editInput.className = "edit-input";
  editInput.value = todo.text;
  span.parentNode.replaceChild(editInput, span);
  editInput.focus();
  editInput.select();

  // Enter/Escape and blur can all fire for the same edit session (removing
  // the input from the DOM on render() triggers a blur too) — this guard
  // makes sure only the first one actually commits or cancels.
  let settled = false;
  const finish = (commit) => {
    if (settled) return;
    settled = true;
    const newText = editInput.value.trim();
    if (commit && newText && newText !== todo.text) {
      todo.text = newText;
      saveTodos();
    }
    render();
  };

  editInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      finish(true);
    } else if (e.key === "Escape") {
      e.preventDefault();
      finish(false);
    }
  });
  editInput.addEventListener("blur", () => finish(true));
}

function renderEmptyHint(listEl, text) {
  const hint = document.createElement("li");
  hint.className = "empty-hint";
  hint.textContent = text;
  listEl.appendChild(hint);
}

function render() {
  const visible = todos.filter(isVisible);

  PRIORITIES.forEach((p) => {
    const listEl = priorityLists[p];
    listEl.innerHTML = "";
    const items = visible.filter((t) => t.priority === p && !t.done);
    if (items.length === 0) {
      renderEmptyHint(listEl, "Keine Aufgaben hier.");
    } else {
      items.forEach((todo) => listEl.appendChild(createRow(todo, { showPriorityBadge: false })));
    }
  });

  doneList.innerHTML = "";
  const doneItems = visible.filter((t) => t.done);
  if (doneItems.length === 0) {
    renderEmptyHint(doneList, "Noch nichts erledigt.");
  } else {
    doneItems.forEach((todo) => doneList.appendChild(createRow(todo, { showPriorityBadge: true })));
  }

  const openItems = visible.filter((t) => !t.done);
  itemsLeft.textContent = `${openItems.length} Aufgabe${openItems.length === 1 ? "" : "n"} offen`;
  const overdueCount = openItems.filter((t) => {
    const info = dueInfo(t);
    return info !== null && info.overdue;
  }).length;
  overdueLeft.textContent = overdueCount ? ` · ${overdueCount} überfällig` : "";

  renderControls();
  renderStats();
}

// Filter tabs (with open-task counts) and the category picker of the add form.
function renderControls() {
  filterButtons.forEach((btn) => {
    const f = btn.dataset.filter;
    btn.setAttribute("aria-pressed", String(f === filter));
    const open = todos.filter((t) => !t.done && (f === "all" || t.category === f)).length;
    btn.querySelector(".count").textContent = open;
  });
  categoryButtons.forEach((btn) => {
    btn.setAttribute("aria-pressed", String(btn.dataset.category === newCategory));
  });
}

function renderStats() {
  const countsByDate = {};
  history.forEach((h) => {
    countsByDate[h.date] = (countsByDate[h.date] || 0) + 1;
  });

  // streak: consecutive days with at least one completion, walking back
  // from today (today not having entries yet doesn't break the streak)
  const daysWithCompletions = new Set(Object.keys(countsByDate));
  let streak = 0;
  const cursor = new Date();
  if (!daysWithCompletions.has(dateStr(cursor))) {
    cursor.setDate(cursor.getDate() - 1);
  }
  while (daysWithCompletions.has(dateStr(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  streakEl.textContent = `🔥 ${streak} Tag${streak === 1 ? "" : "e"} Streak`;

  // last 7 days, oldest to newest
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const maxCount = Math.max(1, ...days.map((d) => countsByDate[dateStr(d)] || 0));

  chartEl.innerHTML = "";
  days.forEach((d) => {
    const ds = dateStr(d);
    const count = countsByDate[ds] || 0;
    const isToday = ds === dateStr(new Date());

    const dayEl = document.createElement("div");
    dayEl.className = "chart-day" + (isToday ? " today" : "");

    const countEl = document.createElement("span");
    countEl.className = "chart-count";
    countEl.textContent = count || "";

    const track = document.createElement("div");
    track.className = "chart-bar-track";
    const bar = document.createElement("div");
    bar.className = "chart-bar";
    bar.style.height = `${(count / maxCount) * 100}%`;
    track.appendChild(bar);

    const label = document.createElement("span");
    label.className = "chart-label";
    label.textContent = d.toLocaleDateString("de-DE", { weekday: "short" }).replace(".", "");

    dayEl.appendChild(countEl);
    dayEl.appendChild(track);
    dayEl.appendChild(label);
    chartEl.appendChild(dayEl);
  });
}

function setFilter(next) {
  filter = next;
  writePref(FILTER_KEY, filter);
  if (filter !== "all") setNewCategory(filter, false);
  render();
}

function setNewCategory(category, rerender = true) {
  newCategory = category;
  writePref(CATEGORY_KEY, category);
  if (rerender) renderControls();
}

function addTodo(text, category, due) {
  todos.push({ id: Date.now(), text, done: false, priority: "high", category, due });
  saveTodos();
  // A task that the active filter would hide is easy to mistake for "lost".
  if (filter !== "all" && filter !== category) setFilter("all");
  else render();
}

function toggleTodo(id) {
  const todo = todos.find((t) => t.id === id);
  if (!todo) return;

  todo.done = !todo.done;
  if (todo.done) {
    history.push({ todoId: id, date: dateStr(new Date()) });
  } else {
    const idx = history.findIndex((h) => h.todoId === id);
    if (idx !== -1) history.splice(idx, 1);
  }
  saveHistory();
  saveTodos();
  render();
}

function deleteTodo(id) {
  todos = todos.filter((t) => t.id !== id);
  saveTodos();
  render();
}

// Called after a drag ends: reads the final DOM order of each priority
// list and rewrites todos' order + priority to match what's on screen.
// Tasks that are not on screen (done, or hidden by the filter) keep their
// relative order and are appended after the reordered ones.
function commitOrder() {
  const placed = new Set();
  const reordered = [];
  PRIORITIES.forEach((p) => {
    [...priorityLists[p].children].forEach((li) => {
      if (!li.dataset.id) return;
      const todo = todos.find((t) => t.id === Number(li.dataset.id));
      if (todo && !placed.has(todo.id)) {
        todo.priority = p;
        reordered.push(todo);
        placed.add(todo.id);
      }
    });
  });
  todos = reordered.concat(todos.filter((t) => !placed.has(t.id)));
  saveTodos();
  render();
}

// Press-and-hold drag reordering, built on Pointer Events so the same
// code drives mouse (trackpad app) and touch (iPhone) drag gestures.
const LONG_PRESS_MS = 250;
const MOVE_CANCEL_PX = 8;

function isInteractive(target) {
  return target.closest("input, button, label");
}

function startDrag(li, pointerId) {
  li.classList.add("dragging");
  // Best-effort: capture keeps tracking smooth if the pointer briefly leaves
  // the element, but drag must keep working via the document-level
  // listeners below even if capture isn't available for this pointer.
  try {
    li.setPointerCapture(pointerId);
  } catch (err) {
    /* no active pointer session to capture — fall through */
  }

  const onMove = (e) => {
    if (e.pointerId !== pointerId) return;
    e.preventDefault();
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const list = target && target.closest(".priority-list");
    if (!list) return;
    const siblings = [...list.querySelectorAll(".todo-row:not(.dragging)")];
    const next = siblings.find(
      (sib) => e.clientY <= sib.getBoundingClientRect().top + sib.getBoundingClientRect().height / 2
    );
    list.insertBefore(li, next || null);
  };

  const onUp = (e) => {
    if (e.pointerId !== pointerId) return;
    li.classList.remove("dragging");
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    commitOrder();
  };

  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

document.addEventListener("pointerdown", (e) => {
  const li = e.target.closest(".todo-row");
  if (!li || li.classList.contains("completed") || isInteractive(e.target)) return;

  const startX = e.clientX;
  const startY = e.clientY;
  let moved = false;

  const cancelWatch = () => {
    clearTimeout(timer);
    document.removeEventListener("pointermove", onEarlyMove);
    document.removeEventListener("pointerup", onEarlyUp);
  };
  const onEarlyMove = (ev) => {
    if (Math.abs(ev.clientX - startX) > MOVE_CANCEL_PX || Math.abs(ev.clientY - startY) > MOVE_CANCEL_PX) {
      moved = true;
      cancelWatch();
    }
  };
  const onEarlyUp = () => cancelWatch();

  document.addEventListener("pointermove", onEarlyMove);
  document.addEventListener("pointerup", onEarlyUp);

  const timer = setTimeout(() => {
    cancelWatch();
    if (!moved) startDrag(li, e.pointerId);
  }, LONG_PRESS_MS);
});

// ---- Voice input -----------------------------------------------------
// Uses the browser's speech recognition where the device offers it. If it
// is missing the mic button stays hidden; the keyboard's own dictation
// key (iPhone) or Fn-Fn / Edit > Start Dictation (Mac) still works.
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let hintTimer = null;

function showVoiceHint(message) {
  voiceHint.textContent = message;
  voiceHint.hidden = !message;
  clearTimeout(hintTimer);
  if (message) hintTimer = setTimeout(() => showVoiceHint(""), 9000);
}

function voiceErrorMessage(code) {
  switch (code) {
    case "not-allowed":
      return "Mikrofon oder Spracherkennung ist nicht erlaubt. Bitte in den Systemeinstellungen unter „Datenschutz“ freigeben – oder das Mikrofon-Symbol der Tastatur nutzen.";
    case "service-not-allowed":
      return "Spracherkennung ist auf diesem Gerät ausgeschaltet. Bitte „Diktat“ in den Systemeinstellungen (Tastatur) aktivieren.";
    case "no-speech":
      return "Nichts gehört – bitte noch einmal versuchen.";
    case "audio-capture":
      return "Kein Mikrofon gefunden.";
    case "network":
      return "Die Spracherkennung braucht gerade eine Internetverbindung.";
    case "language-not-supported":
      return "Deutsche Spracherkennung ist auf diesem Gerät nicht verfügbar.";
    case "aborted":
      return "";
    default:
      return "Spracheingabe hat nicht funktioniert. Alternativ das Mikrofon-Symbol der Tastatur nutzen.";
  }
}

function setListening(isListening) {
  micBtn.classList.toggle("listening", isListening);
  micBtn.setAttribute("aria-pressed", String(isListening));
  micBtn.title = isListening ? "Aufnahme beenden" : "Aufgabe einsprechen";
}

function startVoice() {
  showVoiceHint("");
  const rec = new SpeechRecognitionAPI();
  rec.lang = "de-DE";
  rec.interimResults = true;
  rec.continuous = false;
  const baseText = input.value.trim();

  rec.onstart = () => setListening(true);
  rec.onresult = (e) => {
    let spoken = "";
    for (let i = 0; i < e.results.length; i++) spoken += e.results[i][0].transcript;
    input.value = (baseText ? baseText + " " : "") + spoken.trim();
  };
  rec.onerror = (e) => showVoiceHint(voiceErrorMessage(e.error));
  rec.onend = () => {
    setListening(false);
    recognition = null;
  };

  recognition = rec;
  try {
    rec.start();
  } catch (err) {
    recognition = null;
    showVoiceHint(voiceErrorMessage("unknown"));
  }
}

if (SpeechRecognitionAPI) {
  micBtn.hidden = false;
  micBtn.addEventListener("click", () => {
    if (recognition) recognition.stop();
    else startVoice();
  });
}

// ---- Wiring ----------------------------------------------------------
form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (recognition) recognition.stop();
  const text = input.value.trim();
  if (!text) return;
  addTodo(text, newCategory, dueInput.value || null);
  input.value = "";
  dueInput.value = "";
  showVoiceHint("");
  input.focus();
});

categoryButtons.forEach((btn) => {
  btn.addEventListener("click", () => setNewCategory(btn.dataset.category));
});

filterButtons.forEach((btn) => {
  btn.addEventListener("click", () => setFilter(btn.dataset.filter));
});

clearCompletedBtn.addEventListener("click", () => {
  todos = todos.filter((t) => !t.done || !isVisible(t));
  saveTodos();
  render();
});

render();

</script>
</body>
</html>
